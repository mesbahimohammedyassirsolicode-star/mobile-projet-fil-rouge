<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classification des chambres</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
        <header class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-wide text-indigo-600">Réservation d’hôtels</p>
            <h1 class="mt-2 text-3xl font-bold">Classification des chambres par catégorie</h1>
            <p class="mt-2 text-slate-600">Ajoutez des chambres et classez-les par catégorie. Les données sont enregistrées dans un fichier JSON.</p>
        </header>

        <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="mb-5 text-xl font-semibold">Ajouter une chambre</h2>
            <div id="message" class="mb-4 hidden rounded-lg px-4 py-3 text-sm" role="status" aria-live="polite"></div>
            <form id="chambre-form" class="grid gap-4 sm:grid-cols-3">
                <label class="text-sm font-medium">Numéro de chambre
                    <input name="numero" required maxlength="20" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                </label>
                <label class="text-sm font-medium">Prix par nuit (DH)
                    <input name="prix" type="number" min="0.01" step="0.01" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                </label>
                <label class="text-sm font-medium">Catégorie
                    <select name="category_id" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal">
                        <option value="">Sélectionner une catégorie</option>
                        <option value="1">1 - Simple</option>
                        <option value="2">2 - Double</option>
                        <option value="3">3 - Suite</option>
                    </select>
                </label>
                <div class="sm:col-span-3">
                    <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">Ajouter la chambre</button>
                </div>
            </form>
        </section>

        <section class="mt-8 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <h2 class="text-xl font-semibold">Chambres enregistrées</h2>
                <label class="text-sm font-medium">Filtrer par catégorie
                    <select id="category-filter" class="mt-1 rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal sm:ml-2">
                        <option value="">Toutes les catégories</option>
                        <option value="1">Simple</option>
                        <option value="2">Double</option>
                        <option value="3">Suite</option>
                    </select>
                </label>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full min-w-[520px] text-left text-sm">
                    <thead class="border-b border-slate-200 bg-slate-50 text-xs uppercase text-slate-600">
                        <tr><th class="px-3 py-3">ID</th><th class="px-3 py-3">Numéro</th><th class="px-3 py-3">Prix/Nuit</th><th class="px-3 py-3">Catégorie</th></tr>
                    </thead>
                    <tbody id="chambres-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
